<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Control Center (Go)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0d0f14;--panel:#161a22;--panel2:#1d222d;--line:#2a3140;--txt:#e8eaf0;--dim:#8b93a7;
--acc:#ff00d2;--acc2:#00e0ff;--ok:#37c871;--warn:#ffb020;--err:#ff4d5e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.6 "Segoe UI",system-ui,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);
background:linear-gradient(90deg,#12151d,#0d0f14);position:sticky;top:0;z-index:9}
header .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--acc2))}
header h1{font-size:17px;font-weight:600}
header .sub{color:var(--dim);font-size:12px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav button{background:transparent;border:1px solid transparent;color:var(--dim);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px}
nav button:hover{color:var(--txt);background:var(--panel2)}
nav button.active{color:#fff;background:var(--panel2);border-color:var(--line)}
main{max-width:1180px;margin:0 auto;padding:22px}
.page{display:none}
.page.active{display:block}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h3{font-size:14px;color:var(--acc2);margin-bottom:10px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.row label{min-width:110px;color:var(--dim);font-size:13px}
.row .val{min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--acc)}
select,input[type=number],input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
border-radius:7px;padding:6px 10px;font-size:13px}
button.act{background:linear-gradient(135deg,#272d3b,#1d2230);border:1px solid var(--line);color:var(--txt);
padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px}
button.act:hover{border-color:var(--acc)}
button.act.primary{background:linear-gradient(135deg,var(--acc),#b8009a);border-color:transparent;color:#fff}
button.act.blue{background:linear-gradient(135deg,#00a8ff,#0077c8);border-color:transparent;color:#fff}
button.act:disabled{opacity:.45;cursor:not-allowed}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tile{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;
padding:20px 16px;text-align:center;cursor:pointer;transition:.15s}
.tile:hover{transform:translateY(-3px);border-color:var(--acc)}
.tile .ico{font-size:34px}
.tile .t{margin-top:8px;font-weight:600}
.tile .d{color:var(--dim);font-size:12px;margin-top:4px}
.tile.off{opacity:.35;pointer-events:none}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.mode{border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;background:var(--panel2)}
.mode .ico{font-size:30px}
.mode .n{margin-top:6px;font-weight:600}
.mode.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px}
.kv b{color:var(--dim);font-weight:400}
.gauge{display:flex;flex-direction:column;align-items:center}
.gauge .num{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.gauge .lbl{color:var(--dim);font-size:12px}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;width:100%;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--dim);font-weight:500}
.badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;background:var(--panel2);border:1px solid var(--line)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.badge.err{color:var(--err);border-color:var(--err)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--panel2);border:1px solid var(--acc);
padding:10px 18px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.switch{position:relative;width:42px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:.2s}
.switch i:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;border-radius:50%;background:var(--dim);transition:.2s}
.switch input:checked+i{background:var(--acc);border-color:var(--acc)}
.switch input:checked+i:before{left:22px;background:#fff}
canvas{width:100%;height:180px;background:var(--panel2);border-radius:8px}
.hint{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <div><h1>Control Center</h1><div class="sub" id="modeline">正在连接 ACPI 桥驱动…</div></div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const api=async(u,d)=>{const r=await fetch("/api/"+u,{method:d?"POST":"GET",
  headers:{"Content-Type":"application/json"},body:d?JSON.stringify(d):undefined});
  if(!r.ok)throw new Error("HTTP "+r.status);return r.json()};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800)}
const MODE_NAMES=["安静模式","节能模式","性能模式","娱乐模式","安静增强"];
const FAN_MODES=["自动","最大","静音","x3","x4","Max Q","自定义","x7","无噪声","IFSC"];
let STATUS=null;

/* ---------- 导航 ---------- */
const PAGES=[
 {id:"home",t:"主页",ico:"⌂"},
 {id:"mode",t:"电源模式",ico:"⚡"},
 {id:"pref",t:"偏好设置",ico:"⚙"},
 {id:"fan",t:"风扇控制",ico:"🌀"},
 {id:"kb",t:"键盘灯",ico:"⌨"},
 {id:"cpu",t:"CPU 超频",ico:"🧠"},
 {id:"gpu",t:"GPU 超频",ico:"🎯"},
 {id:"bat",t:"电池",ico:"🔋"},
 {id:"energy",t:"节能计划",ico:"🌱"},
];
function nav(id){PAGES.forEach(p=>{const b=$("#nav-"+p.id);b&&b.classList.toggle("active",p.id===id)});
  $$(".page").forEach(p=>p.classList.remove("active"));const pg=$("#page-"+id);pg&&pg.classList.add("active");
  (PAGE_INIT[id]||(()=>{}))();}
$("#nav").innerHTML=PAGES.map(p=>`<button id="nav-${p.id}" onclick="nav('${p.id}')">${p.t}</button>`).join("");
window.nav=nav;

/* ---------- 主页 ---------- */
async function loadHome(){
 const st=await api("status");STATUS=st;
 $("#modeline").textContent=`${st.manufacturer||"—"} ${st.product||""} · BIOS ${st.bios||"—"} · `+
   `CPU ${st.cpu||"—"} · ClevoID ${st.clevoID} · 客户 ${st.customerID}`;
 const s=st.support;
 const tiles=[
  ["mode","⚡","电源模式","情境模式切换/涡轮风扇/DTT",s.powerMode],
  ["fan","🌀","风扇转速控制","风扇模式/曲线/防尘",s.fan],
  ["kb","⌨","键盘灯设置","RGB/亮度/灯效",st.kbType>0],
  ["cpu","🧠","CPU 超频","PL1/PL2/倍频/电压",s.cpuoc],
  ["gpu","🎯","GPU 超频","核心/显存偏移",s.gpuoc],
  ["bat","🔋","电池工具","健康诊断/校准",s.battery],
  ["energy","🌱","节能计划","功耗监控/充放电调度",s.energy],
 ];
 $("#page-home").innerHTML=`<div class="tiles">${tiles.map(t=>
   `<div class="tile ${t[4]?"":"off"}" onclick="nav('${t[0]}')"><div class="ico">${t[1]}</div>
    <div class="t">${t[2]}</div><div class="d">${t[3]}</div></div>`).join("")}</div>
  <div class="card" style="margin-top:16px"><h3>系统信息</h3><div class="kv">
   <b>键盘灯类型</b><span>${["无","白光","RGB 三区","每键 RGB","—","—","RGB15","—","","","","","","","","","","","","","","","","RGB15 自定义"][st.kbType]||st.kbType}</span>
   <b>当前模式</b><span>${MODE_NAMES[st.mode]??st.mode}</span>
   <b>界面语言</b><span>${st.language}</span>
   <b>Turbo 风扇</b><span>${s.turboFan?"支持":"不支持"}</span>
   <b>慢速风扇</b><span>${s.slowFan?"支持":"不支持"}</span>
   <b>MS Hybrid 切换</b><span>${s.msHybrid?"支持":"不支持"}</span>
   <b>AMD 手动模式</b><span>${s.amdRyzen?"支持":"不支持"}</span>
   <b>Intel DTT</b><span>${s.dtt?"支持":"不支持"}</span>
  </div></div>`;
}

/* ---------- 电源模式 ---------- */
async function loadMode(){
 const st=await api("status");const s=st.support;
 const opts=await api("mode/options");
 const modes=[];
 if(s.powerMode){
  if(st.mode!==undefined){/*OK*/}
  const list=[];
  const ver=s.powerMode;
  list.push([0,"🌙","安静",ver]);
  list.push([1,"🔋","节能",ver]);
  list.push([2,"🚀","性能",ver]);
  list.push([3,"🎮","娱乐",ver]);
  modes.push(...list);
 }
 $("#page-mode").innerHTML=`
  <div class="card"><h3>情境模式</h3>
   <div class="modes">${modes.map(m=>`<div class="mode ${st.mode===m[0]?"sel":""}" onclick="setMode(${m[0]})">
     <div class="ico">${m[1]}</div><div class="n">${m[2]}</div></div>`).join("")}</div>
  </div>
  <div class="grid g2" style="margin-top:14px">
   <div class="card"><h3>性能选项</h3>
    ${s.turboFan?`<div class="row"><label>涡轮风扇</label>
      <label class="switch"><input type="checkbox" id="opt-turbo" ${opts.turboFan?"checked":""}
        onchange="modeOpt('turboFan',this.checked)"><i></i></label></div>`:""}
    <div class="row"><label>CPU 动态调节 (DTT)</label>
      <label class="switch"><input type="checkbox" id="opt-dtt" ${opts.dtt?"checked":""}
        onchange="modeOpt('dtt',this.checked)"><i></i></label></div>
    ${s.slowFan?`<div class="row"><label>无噪声风扇</label>
      <label class="switch"><input type="checkbox" ${opts.noiseless?"checked":""}
        onchange="modeOpt('noiseless',this.checked)"><i></i></label></div>`:""}
    ${opts.lowRefreshSupport?`<div class="row"><label>低刷新率省电</label>
      <label class="switch"><input type="checkbox" ${opts.lowRefresh?"checked":""}
        onchange="modeOpt('lowRefresh',this.checked)"><i></i></label></div>`:""}
   </div>
   <div class="card"><h3>说明</h3>
    <div class="kv">
     <b>切换通道</b><span>WMI 121/25 + Windows 电源计划 + 风扇/键盘灯联动</span>
     <b>当前模式</b><span id="curmode">${MODE_NAMES[st.mode]??st.mode}</span>
    </div>
    <p class="hint">模式切换由引擎完成:EC 下发 → 电源计划 → GPU 联动 → 风扇联动 → 广播 clevofnkey^202。</p>
   </div>
  </div>`;
}
async function setMode(m){try{await api("mode",{mode:m});toast("已请求切换到 "+MODE_NAMES[m]);
  setTimeout(()=>loadMode(),900);}catch(e){toast("切换失败:"+e.message)}}
window.setMode=setMode;
async function modeOpt(k,v){try{await api("mode/options",{key:k,value:v});toast("已下发")}catch(e){toast(e.message)}}
window.modeOpt=modeOpt;

/* ---------- 偏好设置 ---------- */
async function loadPref(){
 const p=await api("preference");
 $("#page-pref").innerHTML=`
 <div class="grid g2">
  <div class="card"><h3>FlexiCharger 充电保护</h3>
   <div class="row"><label>启用</label>
    <label class="switch"><input type="checkbox" id="fc-en" ${p.flexiCharger.enabled?"checked":""}><i></i></label></div>
   <div class="row"><label>起始电量 %</label>
    <select id="fc-start">${(p.flexiCharger.startTable.length?p.flexiCharger.startTable:[20,30,40,50,60,70,80,90,100]).map(v=>
      `<option ${v===p.flexiCharger.start?"selected":""}>${v}</option>`).join("")}</select></div>
   <div class="row"><label>停止电量 %</label>
    <select id="fc-stop">${(p.flexiCharger.stopTable.length?p.flexiCharger.stopTable:[40,50,60,70,80,90,100]).map(v=>
      `<option ${v===p.flexiCharger.stop?"selected":""}>${v}</option>`).join("")}</select></div>
   <div class="row"><button class="act primary" onclick="saveFC()">应用</button></div>
   <p class="hint">下发:WMI4 sub31 {31,enable,start,stop}</p>
  </div>
  <div class="card"><h3>键盘 Fn 键行为</h3>
   <div class="row"><label>FnLock</label>
    <label class="switch"><input type="checkbox" id="kb-fn" ${p.keyboard.fnLock?"checked":""}><i></i></label></div>
   <div class="row"><label>Win 键启用</label>
    <label class="switch"><input type="checkbox" id="kb-win" ${p.keyboard.winKey?"checked":""}><i></i></label></div>
   <div class="row"><label>Win+Fn 切换</label>
    <label class="switch"><input type="checkbox" id="kb-fnwin" ${p.keyboard.fnWin?"checked":""}><i></i></label></div>
   <div class="row"><button class="act primary" onclick="saveKbPref()">应用</button></div>
   <p class="hint">下发:WMI4 sub25(1=on,2=off 编码)</p>
  </div>
  <div class="card"><h3>显示</h3>
   <div class="row"><label>蓝光过滤</label>
    <input type="range" id="bl" min="0" max="10" step="1" value="${p.blueLight}"
      oninput="$('#blv').textContent=(1+this.value/10).toFixed(1)">
    <span class="val" id="blv">${(1+p.blueLight/10).toFixed(1)}</span></div>
   <div class="row"><label>PgUp/PgDn 启用</label>
    <label class="switch"><input type="checkbox" id="pg" ${p.pgUpDn?"checked":""}><i></i></label></div>
   <div class="row"><button class="act primary" onclick="saveDisplay()">应用</button></div>
   <p class="hint">蓝光:GDI Gamma Ramp;PgUpDn:WMI4 sub26</p>
  </div>
  <div class="card"><h3>GPU 模式切换(需重启)</h3>
   <div class="row"><label>显示模式</label>
    <select id="gpusw">
     ${p.gpuSwitch.support&1?`<option value="1" ${p.gpuSwitch.current===1?"selected":""}>仅集成显卡</option>`:""}
     ${p.gpuSwitch.support&2?`<option value="2" ${p.gpuSwitch.current===2?"selected":""}>仅独立显卡</option>`:""}
     ${p.gpuSwitch.support&4?`<option value="3" ${p.gpuSwitch.current===3?"selected":""}>MS Hybrid</option>`:""}
     ${p.gpuSwitch.support&8?`<option value="4" ${p.gpuSwitch.current===4?"selected":""}>动态切换</option>`:""}
    </select>
    <button class="act primary" onclick="saveGPU()">应用并重启</button></div>
   <p class="hint">下发:WMI4 sub22 → shutdown -f -r -t 0</p>
  </div>
  <div class="card"><h3>界面语言</h3>
   <div class="row"><select id="lang">${[
     [0,"跟随系统"],[1,"English(US)"],[2,"English(GB)"],[3,"Español"],[4,"Deutsch"],[5,"Italiano"],
     [6,"日本語"],[7,"한국어"],[8,"简体中文"],[9,"繁體中文"],[10,"Français"],[11,"Français(CA)"],
     [12,"Português(BR)"],[13,"Português(PT)"],[14,"Türkçe"],[15,"ไทย"],[16,"Tiếng Việt"],[17,"Русский"],[18,"日本語(EP)"]]
     .map(l=>`<option value="${l[0]}" ${p.language===l[0]?"selected":""}>${l[1]}</option>`).join("")}</select>
    <button class="act primary" onclick="saveLang()">应用</button></div>
   <p class="hint">写入 AppSettings(1,2) 并广播 clevofnkey^102</p>
  </div>
 </div>`;
}
async function saveFC(){await api("preference",{flexiCharger:{enabled:$("#fc-en").checked,
  start:+$("#fc-start").value,stop:+$("#fc-stop").value}});toast("FlexiCharger 已下发")}
async function saveKbPref(){await api("preference",{keyboard:{fnLock:$("#kb-fn").checked,
  winKey:$("#kb-win").checked,fnWin:$("#kb-fnwin").checked}});toast("键盘设置已下发")}
async function saveDisplay(){await api("preference",{blueLight:+$("#bl").value,pgUpDn:$("#pg").checked});toast("显示设置已应用")}
async function saveGPU(){if(!confirm("切换 GPU 模式将立即重启,继续?"))return;
 await api("preference",{gpuSwitch:+$("#gpusw").value});toast("已下发,即将重启")}
async function saveLang(){await api("preference",{language:+$("#lang").value});toast("语言已切换")}
window.saveFC=saveFC;window.saveKbPref=saveKbPref;window.saveDisplay=saveDisplay;
window.saveGPU=saveGPU;window.saveLang=saveLang;

/* ---------- 风扇 ---------- */
let fanTimer=null;
async function loadFan(){
 const cfg=await api("fan/config");
 const tbl=await api("fan/table");
 const t=tbl.tables;
 $("#page-fan").innerHTML=`
 <div class="grid g2">
  <div class="card"><h3>实时监控(2 秒刷新)</h3>
   <div class="grid g3" id="fangauges"></div></div>
  <div class="card"><h3>风扇模式</h3>
   <div class="row"><select id="fanmode">${FAN_MODES.map((m,i)=>
     `<option value="${i}" ${cfg.mode===i?"selected":""}>${m}</option>`).join("")}</select>
    <button class="act primary" onclick="setFanMode()">应用</button></div>
   <div class="row"><label>自动偏移</label>
    <input type="range" id="fanoff" min="0" max="100" value="${cfg.offset}"
      oninput="$('#fanoffv').textContent=this.value+'%'">
    <span class="val" id="fanoffv">${cfg.offset}%</span></div>
   <div class="row"><button class="act" onclick="setFanOffset()">应用偏移</button></div>
   <div class="row"><label>防尘</label>
    <button class="act" onclick="antiDust('run')">立即除尘</button></div>
  </div>
 </div>
 <div class="grid g3" style="margin-top:14px">
  ${["CPU 风扇","GPU1 风扇","GPU2 风扇"].map((n,i)=>`
  <div class="card"><h3>${n}曲线(自定义)</h3>
   ${["T1","T2","T3"].map((k,j)=>`<div class="row"><label>${["温度①","温度②","温度③"][j]} ℃</label>
     <input type="number" id="t${i}${j}" value="${t[i]["t"+(j+1)]}" min="35" max="100"></div>`).join("")}
   ${["D1","D2","D3"].map((k,j)=>`<div class="row"><label>${["转速①","转速②","转速③"][j]} %</label>
     <input type="number" id="d${i}${j}" value="${t[i]["d"+(j+1)]}" min="0" max="100"></div>`).join("")}
  </div>`).join("")}
 </div>
 <div class="row" style="margin-top:12px">
  <button class="act primary" onclick="saveFanTable()">保存并启用自定义曲线</button>
  <button class="act" onclick="resetFanTable()">恢复默认曲线</button>
 </div>`;
 if(fanTimer)clearInterval(fanTimer);
 const tick=async()=>{try{const l=await api("fan/live");
  const g=[["CPU",l.cpu],["GPU1",l.gpu1],["GPU2",l.gpu2],["SYS",l.sys]];
  $("#fangauges").innerHTML=g.map(x=>`<div class="gauge">
    <div class="num">${x[1].temp??0}°C</div><div class="lbl">${x[0]} ${x[1].rpm} RPM / ${x[1].duty}%</div>
    <div class="bar"><i style="width:${Math.min(100,x[1].duty)}%"></i></div></div>`).join("");
 }catch(e){}};
 tick();fanTimer=setInterval(tick,2000);
}
async function setFanMode(){await api("fan/config",{mode:+$("#fanmode").value});toast("风扇模式已下发")}
async function setFanOffset(){await api("fan/config",{offset:+$("#fanoff").value});toast("偏移已下发")}
async function antiDust(a){await api("fan/antidust",{action:a});toast("除尘已启动")}
async function saveFanTable(){const tables=[0,1,2].map(i=>({T1:+$("#t"+i+"0").value,T2:+$("#t"+i+"1").value,
  T3:+$("#t"+i+"2").value,D1:+$("#d"+i+"0").value,D2:+$("#d"+i+"1").value,D3:+$("#d"+i+"2").value}));
 await api("fan/table",{tables});toast("自定义曲线已下发")}
async function resetFanTable(){await api("fan/table",{reset:true});toast("已恢复 EC 默认曲线")}
window.setFanMode=setFanMode;window.setFanOffset=setFanOffset;window.antiDust=antiDust;
window.saveFanTable=saveFanTable;window.resetFanTable=resetFanTable;

/* ---------- 键盘灯 ---------- */
async function loadKB(){
 const s=await api("kb/state");
 const t=s.type;
 const KBTYPE=["无 LED","白光","RGB 三区","每键 RGB","","","RGB15 色","","","","","","","","","","","","","","","","RGB15 自定义"][t]||t;
 const effects=[[0,"随机"],[2,"呼吸"],[3,"循环"],[4,"波浪"],[5,"舞蹈"],[6,"节拍"],[7,"闪烁"]];
 $("#page-kb").innerHTML=`
 <div class="grid g2">
  <div class="card"><h3>总控(${KBTYPE})</h3>
   <div class="row"><label>灯光开关</label>
    <label class="switch"><input type="checkbox" id="kb-on" ${s.on?"checked":""}
      onchange="kbCmd('onoff',{mode:this.checked?1:0})"><i></i></label></div>
   <div class="row"><label>亮度(0-4)</label>
    <input type="range" id="kb-br" min="0" max="4" value="${s.brightness}"
      oninput="$('#kb-brv').textContent=this.value">
    <span class="val" id="kb-brv">${s.brightness}</span>
    <button class="act" onclick="kbCmd('brightness',{level:+$('#kb-br').value})">应用</button></div>
   <div class="row"><label>睡眠定时</label>
    <label class="switch"><input type="checkbox" id="kb-slp" ${s.sleepTrigger?"checked":""}><i></i></label>
    <input type="number" id="kb-slps" min="5" max="7200" value="${s.sleepSeconds||30}" style="width:90px"> 秒
    <button class="act" onclick="kbCmd('sleep',{mode:$('#kb-slp').checked?1:0,seconds:+$('#kb-slps').value})">应用</button></div>
   <div class="row"><label>开机保留灯效</label>
    <label class="switch"><input type="checkbox" ${s.overrideBoot?"checked":""}
      onchange="kbCmd('override',{override:this.checked?1:0})"><i></i></label></div>
   <div class="row"><button class="act" onclick="kbCmd('reset',{})">恢复默认</button></div>
  </div>
  ${t===1?`<div class="card"><h3>白光亮度</h3>
    <p class="hint">白光键盘仅有亮度控制(WMI 39)。</p></div>`:`
  <div class="card"><h3>颜色(WMI 103 分区)</h3>
   <div class="row"><label>区域</label>
    <select id="kb-part">
     <option value="all">整键盘</option><option value="left">左区</option>
     <option value="mid">中区</option><option value="right">右区</option>
     <option value="tp">触摸板</option><option value="logo">Logo</option>
     <option value="lightbar">灯带</option></select></div>
   <div class="row"><label>R</label><input type="number" id="kb-r" min="0" max="255" value="255">
    <label>G</label><input type="number" id="kb-g" min="0" max="255" value="0">
    <label>B</label><input type="number" id="kb-b" min="0" max="255" value="0"></div>
   <div class="row"><button class="act primary" onclick="setKBColor()">应用颜色</button></div>
   <div class="row" style="margin-top:10px"><label>灯效</label>
    <select id="kb-eff">${effects.map(e=>`<option value="${e[0]}" ${s.mode===e[0]?"selected":""}>${e[1]}</option>`).join("")}</select>
    <button class="act blue" onclick="kbCmd('effect',{effect:+$('#kb-eff').value,
      r:+$('#kb-r').value,g:+$('#kb-g').value,b:+$('#kb-b').value})">应用灯效</button></div>
   <p class="hint">命令字:0xE0 开关位图 / 0xF4 亮度 / 0xF0-0xF6 分区色 / 模式常量。</p>
  </div>`}
 </div>`;
}
async function kbCmd(cmd,p){try{await api("kb/cmd",Object.assign({cmd},p));toast("已下发")}catch(e){toast(e.message)}}
async function setKBColor(){await kbCmd("color",{part:$("#kb-part").value,
  r:+$("#kb-r").value,g:+$("#kb-g").value,b:+$("#kb-b").value})}
window.kbCmd=kbCmd;window.setKBColor=setKBColor;

/* ---------- CPU 超频 ---------- */
async function loadCPU(){
 const d=await api("cpu/info");const p=d.params;const inf=d.info;
 const coreInputs=(arr,n,pre)=>Array.from({length:n},(_,i)=>
  `<div class="row"><label>${pre}核 ${i+1}</label>
   <input type="number" class="cr" id="pc${pre}${i}" min="${inf.ratioMin}" max="${inf.ratioMax}" value="${arr[i]||0}" style="width:90px"></div>`).join("");
 $("#page-cpu").innerHTML=`
 <div class="grid g2">
  <div class="card"><h3>实时状态</h3><div class="kv">
   <b>CPU</b><span>${STATUS?.cpu||""}</span>
   <b>当前频率</b><span>${inf.CPUMHz} MHz</span>
   <b>电压</b><span>${inf.CPUVolt.toFixed?inf.CPUVolt.toFixed(3):inf.CPUVolt} V</span>
   <b>温度</b><span>${inf.CPUTemp} ℃</span>
   <b>利用率</b><span>${inf.CPUUtil}%</span>
   <b>内存频率</b><span>${inf.MemMHz} MHz</span>
   <b>Turbo 范围</b><span>${inf.TurboMinMHz} ~ ${inf.TurboMaxMHz} MHz(参考时钟 ${inf.RefClock})</span>
   <b>倍频范围</b><span>${inf.ratioMin}x ~ ${inf.ratioMax}x</span>
  </div></div>
  <div class="card"><h3>功耗与电压</h3>
   <div class="row"><label>PL1 (W)</label><input type="number" id="pl1" value="${p.PL1Watt}" min="1" max="330" style="width:90px"></div>
   <div class="row"><label>PL2 (W)</label><input type="number" id="pl2" value="${p.PL2Watt}" min="1" max="330" style="width:90px"></div>
   <div class="row"><label>PL 时间 (s)</label><input type="number" id="plt" value="${p.PLTimeSec}" min="1" max="128" style="width:90px"></div>
   <div class="row"><label>VR Auto</label>
    <label class="switch"><input type="checkbox" id="vra" ${p.VRAuto?"checked":""}><i></i></label></div>
   <div class="row"><label>VR Limit</label><input type="number" id="vr" value="${p.VRLimit}" style="width:90px"></div>
   <div class="row"><label>核心电压偏移</label><input type="number" id="vo" value="${p.CoreOffset}" step="10" style="width:90px"> mV</div>
   <div class="row"><label>Override (V)</label><input type="number" id="ov" value="${p.OverrideVolt}" step="0.1" min="0" max="2" style="width:90px"></div>
  </div>
  <div class="card"><h3>P 核倍频(1-10)</h3>${coreInputs(p.PCores,10,"")}</div>
  <div class="card"><h3>E 核倍频(1-16)</h3>${coreInputs(p.ECores,16,"E")}</div>
 </div>
 <div class="row" style="margin-top:12px">
  <button class="act primary" onclick="cpuApply()">保存并应用(AppSettings page6)</button>
  <button class="act" onclick="cpuDefault()">恢复默认</button>
 </div>`;
}
async function cpuApply(){
 const p={PL1Watt:+$("#pl1").value,PL2Watt:+$("#pl2").value,PLTimeSec:+$("#plt").value,
  VRAuto:$("#vra").checked,VRLimit:+$("#vr").value,CoreOffset:+$("#vo").value,OverrideVolt:+$("#ov").value,
  GraphicsOff:0,PCores:Array.from({length:10},(_,i)=>+($("#pc"+i)?.value||0)),
  ECores:Array.from({length:16},(_,i)=>+($("#pcE"+i)?.value||0))};
 if(!confirm("应用超频参数?"))return;
 await api("cpu/apply",{params:p});toast("参数已写入 page6,后台 XTU 执行中")}
async function cpuDefault(){if(!confirm("恢复全部默认值?"))return;
 await api("cpu/default");toast("已恢复默认");loadCPU()}
window.cpuApply=cpuApply;window.cpuDefault=cpuDefault;

/* ---------- GPU 超频 ---------- */
async function loadGPU(){
 const g=await api("gpu/oc");
 $("#page-gpu").innerHTML=`
 <div class="grid g2">
  <div class="card"><h3>GPU 信息</h3><div class="kv">
   <b>GPU 数量</b><span>${g.count}</span>
   <b>基础频率</b><span>${g.baseClock} MHz</span>
   <b>NVAPI 状态</b><span>${g.ready?"就绪":"未就绪"}</span>
   <b>驱动</b><span>${g.driver||"—"}</span>
   <b>当前生效</b><span>核心 ${g.current.Core} / 显存 ${g.current.Mem} MHz</span>
  </div></div>
  <div class="card"><h3>超频偏移(MHz)</h3>
   <div class="row"><label>GPU0 核心</label>
    <input type="range" id="gc0" min="-200" max="400" step="5" value="${g.saved0.Core}"
      oninput="$('#gc0v').textContent=this.value"><span class="val" id="gc0v">${g.saved0.Core}</span></div>
   <div class="row"><label>GPU0 显存</label>
    <input type="range" id="gm0" min="-200" max="1600" step="5" value="${g.saved0.Mem}"
      oninput="$('#gm0v').textContent=this.value"><span class="val" id="gm0v">${g.saved0.Mem}</span></div>
   ${g.count>1?`
   <div class="row"><label>GPU1 核心</label>
    <input type="range" id="gc1" min="-200" max="400" step="5" value="${g.saved1.Core}"
      oninput="$('#gc1v').textContent=this.value"><span class="val" id="gc1v">${g.saved1.Core}</span></div>
   <div class="row"><label>GPU1 显存</label>
    <input type="range" id="gm1" min="-200" max="1600" step="5" value="${g.saved1.Mem}"
      oninput="$('#gm1v').textContent=this.value"><span class="val" id="gm1v">${g.saved1.Mem}</span></div>`:""}
   <div class="row">
    <button class="act primary" onclick="gpuSave(${g.count>1})">保存并应用</button>
    <button class="act" onclick="gpuReset(${g.count>1})">恢复默认</button></div>
   <p class="hint">写入 AppSettings page5(非对称 int16 编码)→ ControlGPU.exe set_increment。</p>
  </div>
 </div>`;
}
async function gpuSave(dual){await api("gpu/oc",{action:"save",core0:+$("#gc0").value,mem0:+$("#gm0").value,
  core1:+($("#gc1")?.value||0),mem1:+($("#gm1")?.value||0),dual});toast("GPU 偏移已下发")}
async function gpuReset(dual){await api("gpu/oc",{action:"reset",dual});toast("已恢复默认");loadGPU()}
window.gpuSave=gpuSave;window.gpuReset=gpuReset;

/* ---------- 电池 ---------- */
async function loadBat(){
 const b=await api("battery");
 const hc=["健康","老化","需要更换","永久失效"][b.healthCode];
 const cls=b.healthCode===0?"ok":(b.healthCode===1?"warn":"err");
 $("#page-bat").innerHTML=`
 <div class="grid g2">
  <div class="card"><h3>电池信息</h3><div class="kv">
   <b>循环次数</b><span>${b.data.cycleCount}</span>
   <b>满充容量</b><span>${b.data.fullCharge} mAh</span>
   <b>设计容量</b><span>${b.data.design} mAh</span>
   <b>容量保持</b><span>${b.data.capacityPct}%</span>
   <b>使用年限</b><span>${(b.data.ageYears||0).toFixed(1)} 年</span>
   <b>停止充电阈值</b><span>${b.data.stopChargeThreshold}%</span>
  </div>
  <div style="margin-top:10px">健康判定:<span class="badge ${cls}">${hc}</span></div></div>
  <div class="card"><h3>电池校准(完全充放电两次)</h3>
   <p class="hint">校准将强制断开适配器放电(WMI 121/28),请接入电源后开始;整个过程可能耗时数小时。</p>
   <div class="row" style="margin-top:10px">
    ${b.ongoing===0?`<button class="act primary" onclick="batRefresh('start')">开始校准</button>`:
      `<span class="badge warn">校准进行中(阶段 ${b.ongoing})</span>
       <button class="act" onclick="batRefresh('stop')">停止</button>`}
   </div></div>
 </div>`;
}
async function batRefresh(a){if(a==="start"&&!confirm("开始电池校准?期间请保持适配器可断开。"))return;
 await api("battery/refresh",{action:a});toast("已下发");loadBat()}
window.batRefresh=batRefresh;

/* ---------- 节能计划 ---------- */
let wattChart=null,wattData=[];
async function loadEnergy(){
 $("#page-energy").innerHTML=`
 <div class="grid g2">
  <div class="card"><h3>实时功耗</h3>
   <canvas id="wattcv" width="560" height="180"></canvas>
   <div class="row"><span class="num" id="wattnow" style="font-size:22px;font-weight:700">-- W</span>
    <span style="color:var(--dim)">设计电池 ${"—"} Wh · 适配器上限 ${"—"} W</span></div>
  </div>
  <div class="card"><h3>充放电阈值</h3>
   <div class="row"><label>充电上限 %</label>
    <select id="ec-cl">${[60,70,80,90,100].map(v=>`<option ${v===100?"selected":""}>${v}</option>`).join("")}</select></div>
   <div class="row"><label>放电下限 %</label>
    <select id="ec-dl">${[40,50,60,70,80,90,95].map(v=>`<option ${v===40?"selected":""}>${v}</option>`).join("")}</select></div>
   <h3 style="margin-top:12px">调度一</h3>
   <div class="row"><label>启用</label><label class="switch"><input type="checkbox" id="es1on"><i></i></label>
    <input type="number" id="es1s" min="0" max="23" value="22" style="width:70px"> 时 起
    <input type="number" id="es1e" min="0" max="23" value="6" style="width:70px"> 时 止</div>
   <h3 style="margin-top:12px">调度二</h3>
   <div class="row"><label>启用</label><label class="switch"><input type="checkbox" id="es2on"><i></i></label>
    <input type="number" id="es2s" min="0" max="23" value="12" style="width:70px"> 时 起
    <input type="number" id="es2e" min="0" max="23" value="14" style="width:70px"> 时 止</div>
   <div class="row"><label>重复</label>
    <select id="es-ev"><option value="1">每天</option><option value="0">按星期</option></select></div>
   <div class="row"><button class="act primary" onclick="energyApply()">应用节能计划</button>
    <button class="act" onclick="energyDisable()">停用</button></div>
   <p class="hint">下发:WMI 118(0x01000000 时间 / 0x02 生效日+阈值 / 0x03/04 调度 / 0x05 使能 / 0x06 阈值)</p>
  </div>
 </div>`;
 if(wattTimer)clearInterval(wattTimer);
 const tick=async()=>{try{const s=await api("energy/sample");wattData.push(s.watt);
  if(wattData.length>60)wattData.shift();
  $("#wattnow").textContent=s.watt.toFixed(1)+" W";
  drawWatt();if(wattTimer===null){}}catch(e){}};
 tick();wattTimer=setInterval(tick,1000);
}
let wattTimer=null;
function drawWatt(){const cv=$("#wattcv");if(!cv)return;const c=cv.getContext("2d");
 const W=cv.width,H=cv.height;c.clearRect(0,0,W,H);
 const max=Math.max(30,...wattData)*1.1;
 c.strokeStyle="#2a3140";c.beginPath();
 for(let i=1;i<4;i++){c.moveTo(0,H*i/4);c.lineTo(W,H*i/4)}c.stroke();
 if(wattData.length<2)return;
 c.strokeStyle="#00e0ff";c.lineWidth=2;c.beginPath();
 wattData.forEach((v,i)=>{const x=i/(59)*W,y=H-(v/max)*H;i?c.lineTo(x,y):c.moveTo(x,y)});
 c.stroke();c.lineWidth=1;
}
async function energyApply(){const p={Name:"go",Schedule1On:$("#es1on").checked,
 Schedule1Start:+$("#es1s").value,Schedule1End:+$("#es1e").value,
 Schedule2On:$("#es2on").checked,Schedule2Start:+$("#es2s").value,Schedule2End:+$("#es2e").value,
 Everyday:$("#es-ev").value==="1",Weekdays:[true,true,true,true,true,true,true],
 AutoBattery:true,ChargeLimit:+$("#ec-cl").value,DischargeLimit:+$("#ec-dl").value};
 if(p.Schedule1On&&p.Schedule2On){const o1=[p.Schedule1Start,p.Schedule1End+1],o2=[p.Schedule2Start,p.Schedule2End+1];
  const d1=o1[0]-o2[1],d2=o1[1]-o2[0];
  if((d1<=0||d2<=0)&&(d1>=0||d2>=0)){toast("两个调度重叠(至少间隔 1 小时)");return}}
 await api("energy/apply",p);toast("节能计划已下发")}
async function energyDisable(){await api("energy/apply",{Name:"off",ChargeLimit:100,DischargeLimit:95,
 Everyday:true,Weekdays:[true,true,true,true,true,true,true]});toast("已停用(阈值 100/95)")}
window.energyApply=energyApply;window.energyDisable=energyDisable;

/* ---------- 启动 ---------- */
const PAGE_INIT={home:loadHome,mode:loadMode,pref:loadPref,fan:loadFan,kb:loadCPU?loadKB:loadKB,
 cpu:loadCPU,gpu:loadGPU,bat:loadBat,energy:loadEnergy};
PAGES.forEach(p=>{const d=document.createElement("div");d.className="page";d.id="page-"+p.id;
 $("#main").appendChild(d)});
(async()=>{try{await loadHome();nav("home")}catch(e){
 $("#main").innerHTML=`<div class="card"><h3>无法连接 ACPI 桥驱动</h3>
  <p>${e.message}</p><p class="hint">请确认 AcpiBridge 驱动已安装且以管理员身份运行。</p></div>`;}})();
</script>
</body>
</html>
