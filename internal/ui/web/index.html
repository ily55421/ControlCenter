<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Control Center</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#000;--panel:rgba(8,10,12,.72);--line:#262c33;--tick:#8f99a3;--txt:#e8eef2;--dim:#66707a;
--cyan:#25c8ff;--cyan-d:#0a7fa8;--lime:#c8ff00;--yellow:#ffc400;--red:#ff3b4d;--blue:#2f7bff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg) radial-gradient(#0d1114 1px,transparent 1.4px);background-size:5px 5px;
color:var(--txt);font:14px/1.6 "Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
#app{display:flex;min-height:100vh}
/* ---------- 侧栏 ---------- */
#side{width:118px;flex:none;background:#0b0d0f;border-right:1px solid #15181b;display:flex;flex-direction:column;transition:width .18s}
#side.min{width:62px}
#side.min .lbl,#side.min .side-top span{display:none}
.side-top{height:52px;background:#101316;border:0;border-bottom:1px solid #15181b;color:#9aa4ad;cursor:pointer;
display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px}
#nav{display:flex;flex-direction:column}
#nav button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:15px 4px 13px;background:transparent;
border:0;border-bottom:1px solid #101316;color:#59636d;cursor:pointer;font-size:12px}
#nav button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#nav button:hover{color:#aeb8c1;background:#0e1114}
#nav button.on{background:#17191c;color:var(--lime)}
#nav button.on svg{filter:drop-shadow(0 0 7px rgba(200,255,0,.55))}
/* ---------- 顶栏 ---------- */
#col{flex:1;min-width:0;display:flex;flex-direction:column}
header{height:46px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;
background:linear-gradient(#0a0c0e,#050708);border-bottom:1px solid #14171a}
.htitle{font-size:17px;font-weight:600;letter-spacing:.6px}
.hbtns{position:absolute;right:12px;display:flex;gap:8px}
.hbtns button{width:32px;height:26px;background:#101316;border:1px solid #23282d;color:#9aa4ad;border-radius:3px;cursor:pointer;font-size:13px}
.hbtns button:hover{color:#fff;border-color:#39424b}
#modeline{color:#5f6a74;font-size:12px;padding:10px 20px 0;letter-spacing:.4px}
main{padding:12px 20px 46px;flex:1}
.page{display:none}.page.on{display:block}
/* ---------- 面板 ---------- */
.panel{position:relative;border:1px solid var(--line);background:var(--panel);padding:14px 16px 16px;margin-bottom:14px}
.cnr{position:absolute;width:9px;height:9px;border:0 solid var(--tick);pointer-events:none}
.c1{top:-1px;left:-1px;border-top-width:1px;border-left-width:1px}
.c2{top:-1px;right:-1px;border-top-width:1px;border-right-width:1px}
.c3{bottom:-1px;left:-1px;border-bottom-width:1px;border-left-width:1px}
.c4{bottom:-1px;right:-1px;border-bottom-width:1px;border-right-width:1px}
.panel h3{font-size:13px;font-weight:600;color:#cfd6dc;letter-spacing:2px;margin-bottom:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.row{display:flex;align-items:center;gap:12px;margin:9px 0;flex-wrap:wrap}
.row label.k{min-width:96px;color:var(--dim);font-size:13px}
.val{min-width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--lime)}
/* ---------- 斜切标签 ---------- */
.tabrow{display:flex;gap:30px;justify-content:center;align-items:center;margin:4px 0 16px;flex-wrap:wrap}
.tab{transform:skewX(-14deg);padding:5px 28px;color:var(--dim);font-size:15px;cursor:pointer;background:transparent;border:0;letter-spacing:1px}
.tab>span{display:block;transform:skewX(14deg)}
.tab:hover{color:#cfd6dc}
.tab.on{background:var(--cyan);color:#00161c;font-weight:600;text-shadow:none}
.tab.y.on{background:var(--yellow);color:#201500}
.tab.sm{padding:3px 16px;font-size:13px}
/* ---------- 数字/仪表 ---------- */
.bignum{font-size:46px;font-weight:200;line-height:1.05;letter-spacing:1px}
.unit{color:var(--dim);font-size:13px}
canvas.dial{display:block;margin:0 auto;filter:drop-shadow(0 0 8px rgba(37,200,255,.28))}
.stat3{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;padding:0 8px}
.stat3 .c{text-align:center}
.stat3 .l{color:var(--dim);font-size:12px;display:flex;gap:6px;justify-content:center;align-items:center}
/* ---------- 条 ---------- */
.bar{height:7px;background:#101418;position:relative;border-radius:0;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:radial-gradient(circle at 3px 3.5px,var(--lime) 1.7px,transparent 2.3px) 0 0/9px 7px repeat-x}
.bar.cy>i{background:radial-gradient(circle at 3px 3.5px,var(--cyan) 1.7px,transparent 2.3px) 0 0/9px 7px repeat-x}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:13px}
.kv b{color:var(--dim);font-weight:400}
/* ---------- 滑杆 ---------- */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;background:
 radial-gradient(circle at 3px 2.5px,var(--lime) 1.5px,transparent 2.1px) 0 0/14px 5px repeat-x,#0c1013}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:5px;height:19px;background:#e8eef2;margin-top:-7px;
 box-shadow:0 0 7px rgba(255,255,255,.7)}
input[type=range]::-moz-range-track{height:5px;background:
 radial-gradient(circle at 3px 2.5px,var(--lime) 1.5px,transparent 2.1px) 0 0/14px 5px repeat-x,#0c1013}
input[type=range]::-moz-range-thumb{width:5px;height:19px;border:0;border-radius:0;background:#e8eef2}
input[type=range].cy::-webkit-slider-runnable-track{background:
 radial-gradient(circle at 3px 2.5px,var(--cyan) 1.5px,transparent 2.1px) 0 0/14px 5px repeat-x,#0c1013}
/* ---------- 控件 ---------- */
select,input[type=number],input[type=text]{background:#0c1013;border:1px solid #262c33;color:var(--txt);
border-radius:2px;padding:6px 10px;font-size:13px}
button.act{background:#101418;border:1px solid #2c343c;color:#cfd6dc;padding:7px 20px;cursor:pointer;font-size:13px;
letter-spacing:1px;transform:skewX(-10deg)}
button.act>span{display:block;transform:skewX(10deg)}
button.act:hover{border-color:var(--cyan);color:#fff}
button.act.pri{background:var(--cyan);border-color:var(--cyan);color:#00161c;font-weight:600}
button.act.warn{background:var(--yellow);border-color:var(--yellow);color:#201500;font-weight:600}
button.act:disabled{opacity:.4;cursor:not-allowed}
.sw{position:relative;width:40px;height:20px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:#0c1013;border:1px solid #2c343c;cursor:pointer}
.sw i:before{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;background:#59636d;transition:.15s}
.sw input:checked+i{border-color:var(--lime)}
.sw input:checked+i:before{left:22px;background:var(--lime);box-shadow:0 0 8px rgba(200,255,0,.6)}
/* ---------- 磁贴 ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;color:#4d5761;font-size:12px;cursor:pointer;background:transparent;border:0}
.tile svg{width:38px;height:38px;stroke:currentColor;fill:none;stroke-width:1.4}
.tile.on{color:var(--lime)}
.tile.on svg{filter:drop-shadow(0 0 8px rgba(200,255,0,.5))}
.tile:hover{color:#aeb8c1}.tile.on:hover{color:var(--lime)}
/* ---------- 键盘图 ---------- */
.kb{display:flex;flex-direction:column;gap:5px;user-select:none}
.kbrow{display:flex;gap:5px}
.key{flex:1;height:36px;min-width:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#b9c2ca;
background:linear-gradient(#191d21,#0b0d0f);border:1px solid #23282d;border-radius:4px;box-shadow:0 2px 0 #000;cursor:default}
.key.glow{cursor:pointer}
/* ---------- 色轮 ---------- */
.wheelbox{position:relative;width:250px;height:250px;margin:0 auto}
.wheel{position:absolute;inset:0;border-radius:50%;cursor:crosshair;
background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
-webkit-mask:radial-gradient(circle,transparent 57%,#000 59%);mask:radial-gradient(circle,transparent 57%,#000 59%)}
.wheelc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:#cfd6dc;font-size:14px;pointer-events:none}
.halo{position:absolute;inset:-46px;border-radius:50%;pointer-events:none;
background:conic-gradient(#f003,#ff03,#0f03,#0ff3,#00f3,#f0f3,#f003);filter:blur(14px);
-webkit-mask:radial-gradient(circle,transparent 40%,#000 62%,transparent 78%);mask:radial-gradient(circle,transparent 40%,#000 62%,transparent 78%)}
/* ---------- 电池 ---------- */
.batt{position:relative;width:270px;height:118px;border:2px solid #cfd6dc;border-radius:10px;margin:8px auto;display:flex;align-items:center;justify-content:center}
.batt:after{content:"";position:absolute;right:-13px;top:36px;width:10px;height:42px;background:#cfd6dc;border-radius:0 4px 4px 0}
.batt .fill{position:absolute;left:5px;top:5px;bottom:5px;background:radial-gradient(circle at 3px 3px,#cfd6dc 1.4px,transparent 2px) 0 0/7px 7px;opacity:.75;border-radius:5px}
.batt .pct{position:relative;font-size:50px;font-weight:800;letter-spacing:3px;text-shadow:0 0 12px #000}
.plug{color:var(--lime);font-size:13px;text-align:center;margin-bottom:6px}
/* ---------- 徽章/提示 ---------- */
.badge{display:inline-block;padding:2px 12px;border:1px solid #2c343c;color:#aeb8c1;font-size:12px;letter-spacing:1px}
.badge.ok{color:var(--lime);border-color:var(--lime)}
.badge.warn{color:var(--yellow);border-color:var(--yellow)}
.badge.err{color:var(--red);border-color:var(--red)}
.hint{color:#4d5761;font-size:12px;margin-top:8px;letter-spacing:.3px}
canvas.chart{width:100%;height:170px;background:transparent}
.toast{position:fixed;bottom:26px;right:26px;background:#0c1013;border:1px solid var(--cyan);color:var(--txt);
padding:10px 20px;opacity:0;transition:.25s;pointer-events:none;z-index:99;letter-spacing:1px;box-shadow:0 0 18px rgba(37,200,255,.25)}
.toast.show{opacity:1}
@media (max-width:860px){#side{width:62px}#side .lbl{display:none}}
</style>
</head>
<body>
<div id="app">
 <aside id="side">
  <button class="side-top" id="sideToggle" title="折叠/展开侧栏">☰<span></span></button>
  <nav id="nav"></nav>
 </aside>
 <div id="col">
  <header>
   <div class="htitle">Control Center</div>
   <div class="hbtns">
    <button id="btnInfo" title="系统信息">ⓘ</button>
    <button id="btnFull" title="全屏">⛶</button>
    <button id="btnClose" title="关闭页面">✕</button>
   </div>
  </header>
  <div id="modeline">正在连接 ACPI 桥驱动…</div>
  <main id="main"></main>
 </div>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const api=async(u,d)=>{const r=await fetch("/api/"+u,{method:d?"POST":"GET",
 headers:{"Content-Type":"application/json"},body:d?JSON.stringify(d):undefined});
 if(!r.ok)throw new Error("HTTP "+r.status);return r.json()};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");
 clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1900)}
const MODE_NAMES=["安静模式","节能模式","性能模式","娱乐模式","安静增强"];
const MODE_SHORT=["安静","节能","性能","娱乐","安静增强"];
const FAN_MODES=["自动","最大","静音","x3","x4","Max Q","自定义","x7","无噪声","IFSC"];
let STATUS=null;
/* ---------- 图标 ---------- */
const ICO={
system:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M9 20h6M12 16v4M7 9h4M7 12h7"/></svg>',
kb:'<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="1"/><path d="M5 10h1M8 10h1M11 10h1M14 10h1M17 10h2M5 13h1M8 13h1M11 13h1M14 13h1M17 13h2M7 15.5h10"/></svg>',
fk:'<svg viewBox="0 0 24 24"><path d="M7 3h7a4 4 0 0 1 0 8H10v10H7z"/><path d="M10 7h4"/></svg>',
ch:'<svg viewBox="0 0 24 24"><path d="M13 2 5 13h5l-1 9 8-11h-5z"/></svg>',
cpu:'<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></svg>',
gpu:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1"/><circle cx="9" cy="12" r="3"/><path d="M16 9v6M19 9v6"/></svg>',
bat:'<svg viewBox="0 0 24 24"><rect x="2" y="8" width="17" height="9" rx="1"/><path d="M21 11v3M6 11l3 0-1.5 3H10"/></svg>',
en:'<svg viewBox="0 0 24 24"><path d="M6 20C6 11 12 5 20 4c0 9-5 15-14 16z"/><path d="M6 20c2-6 6-10 10-12"/></svg>',
pf:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>'};
const PAGES=[
 {id:"system",t:"系统监控",ico:ICO.system},
 {id:"kb",t:"LED 设备",ico:ICO.kb},
 {id:"flexikey",t:"FlexiKey",ico:ICO.fk},
 {id:"charger",t:"FlexiCharger",ico:ICO.ch},
 {id:"cpu",t:"CPU 超频",ico:ICO.cpu},
 {id:"gpu",t:"GPU 超频",ico:ICO.gpu},
 {id:"bat",t:"电池",ico:ICO.bat},
 {id:"energy",t:"节能计划",ico:ICO.en},
 {id:"pref",t:"偏好",ico:ICO.pf}];
function nav(id){PAGES.forEach(p=>{const b=$("#nav-"+p.id);b&&b.classList.toggle("on",p.id===id)});
 $$(".page").forEach(p=>p.classList.remove("on"));const pg=$("#page-"+id);pg&&pg.classList.add("on");
 (PAGE_INIT[id]||(()=>{}))();}
$("#nav").innerHTML=PAGES.map(p=>`<button id="nav-${p.id}" onclick="nav('${p.id}')" title="${p.t}">${p.ico}<span class="lbl">${p.t}</span></button>`).join("");
window.nav=nav;
$("#sideToggle").onclick=()=>$("#side").classList.toggle("min");
$("#btnFull").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
$("#btnClose").onclick=()=>window.close();
$("#btnInfo").onclick=()=>{const s=STATUS||{};toast(`${s.manufacturer||""} ${s.product||""} · BIOS ${s.bios||"—"} · ClevoID ${s.clevoID||"—"}`)};
function panel(title,html){return `<section class="panel"><i class="cnr c1"></i><i class="cnr c2"></i><i class="cnr c3"></i><i class="cnr c4"></i><h3>${title}</h3>${html}</section>`}
/* ---------- 仪表盘 ---------- */
function drawDial(cv,val,max,o={}){
 const c=cv.getContext("2d"),W=cv.width,H=cv.height,cx=W/2,cy=H/2,R=Math.min(W,H)/2-8;
 c.clearRect(0,0,W,H);
 const a0=Math.PI*0.75,a1=Math.PI*2.25,N=o.ticks||50;
 c.strokeStyle="#333c45";c.lineWidth=1;
 for(let i=0;i<=N;i++){const a=a0+(a1-a0)*i/N,long=i%(N/5)===0,l=long?9:4;
  c.beginPath();c.moveTo(cx+Math.cos(a)*(R-l),cy+Math.sin(a)*(R-l));c.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);c.stroke();}
 if(o.labels){c.fillStyle="#8a949e";c.font="600 12px Segoe UI";c.textAlign="center";c.textBaseline="middle";
  o.labels.forEach((t,i)=>{const a=a0+(a1-a0)*i/(o.labels.length-1);
   c.fillText(t,cx+Math.cos(a)*(R-22),cy+Math.sin(a)*(R-22))});}
 const p=Math.max(0,Math.min(1,(val||0)/max));
 c.strokeStyle=o.color||"#25c8ff";c.lineWidth=3;c.shadowColor=o.color||"#25c8ff";c.shadowBlur=12;
 c.beginPath();c.arc(cx,cy,R-13,a0,a0+(a1-a0)*p);c.stroke();c.shadowBlur=0;
 const an=a0+(a1-a0)*p;
 c.strokeStyle="#e8eef2";c.lineWidth=2;c.shadowColor="#25c8ff";c.shadowBlur=6;
 c.beginPath();c.moveTo(cx-Math.cos(an)*12,cy-Math.sin(an)*12);c.lineTo(cx+Math.cos(an)*(R-18),cy+Math.sin(an)*(R-18));c.stroke();
 c.shadowBlur=0;c.fillStyle="#050708";c.beginPath();c.arc(cx,cy,7,0,7);c.fill();
 c.strokeStyle="#25c8ff";c.lineWidth=1.5;c.beginPath();c.arc(cx,cy,7,0,7);c.stroke();
 if(o.center){c.fillStyle="#cfd6dc";c.font="600 14px Segoe UI";c.textAlign="center";c.fillText(o.center,cx,cy+R*0.62)}}
/* ---------- 键盘图 ---------- */
const KB_ROWS=[
[["Esc",1.3],["F1",1],["F2",1],["F3",1],["F4",1],["F5",1],["F6",1],["F7",1],["F8",1],["F9",1],["F10",1],["F11",1],["F12",1],["PrtSc",1],["Ins",1],["Del",1]],
[["~",1],["1",1],["2",1],["3",1],["4",1],["5",1],["6",1],["7",1],["8",1],["9",1],["0",1],["-",1],["=",1],["",1.8],["NumLK",1.2],["/",0.8],["*",0.8]],
[["Tab",1.5],["Q",1],["W",1],["E",1],["R",1],["T",1],["Y",1],["U",1],["I",1],["O",1],["P",1],["[",1],["]",1],["\\",1],["7",0.8],["8",0.8],["9",0.8]],
[["Caps",1.8],["A",1],["S",1],["D",1],["F",1],["G",1],["H",1],["J",1],["K",1],["L",1],[";",1],["'",1],["↵",1.9],["4",0.8],["5",0.8],["6",0.8]],
[["Shift",2.3],["Z",1],["X",1],["C",1],["V",1],["B",1],["N",1],["M",1],[",",1],[".",1],["/",1],["Shift",1.9],["1",0.8],["2",0.8],["3",0.8]],
[["Ctrl",1.3],["Fn",1.1],["Win",1.2],["Alt",1.2],["",4.6],["Alt",1.2],["Menu",1.2],["Ctrl",1.3],["←",0.9],["↓",0.9],["→",0.9]]];
function kbHTML(zc){
 return `<div class="kb">`+KB_ROWS.map((row,ri)=>`<div class="kbrow">`+row.map((k,ci)=>{
  let col=null;
  if(zc&&ri>=1&&ri<=4){col=ci<=5?zc.left:ci<=10?zc.mid:zc.right}
  const st=col?`box-shadow:0 0 11px ${col}55,inset 0 -3px 8px ${col}33;border-color:${col}77`:"";
  return `<div class="key${col?" glow":""}" style="flex:${k[1]};${st}">${k[0]}</div>`}).join("")+`</div>`).join("")+`</div>`}
const rgbHex=c=>`#${[c.r,c.g,c.b].map(v=>v.toString(16).padStart(2,"0")).join("")}`;
/* ================= 系统监控 ================= */
let fanTimer=null;
async function loadSystem(){
 const st=await api("status");STATUS=st;
 // 服务重启检测:新进程 boot 标记变化 → 自动刷新,避免窗口停留旧版页面
 if(st.boot){if(window._boot&&window._boot!==st.boot){location.reload();return}window._boot=st.boot}
 $("#modeline").textContent=`${st.manufacturer||"—"} ${st.product||""} · BIOS ${st.bios||"—"} · ${st.cpu||"—"} · ClevoID ${st.clevoID} · 客户 ${st.customerID}`;
 const mo=await api("mode");const opts=await api("mode/options");
 const fc=await api("fan/config");const tbl=(await api("fan/table")).tables;
 const ad=await api("fan/antidust");const pref=await api("preference");
 const g=await api("gpu/oc");
 $("#page-system").innerHTML=`
 <div class="tabrow" id="modetabs">${MODE_SHORT.map((m,i)=>
  `<button class="tab ${mo.mode===i?"on":""}" onclick="setMode(${i})"><span>${m}</span></button>`).join("")}</div>
 <div class="grid" style="grid-template-columns:minmax(340px,5fr) minmax(320px,4fr);gap:16px;align-items:start">
  <div>
   <div style="position:relative">
    <canvas class="dial" id="cpudial" width="330" height="300"></canvas>
   </div>
   <div class="stat3" style="margin-top:4px">

   <b>Turbo 范围</b><span>${inf.TurboMinMHz} ~ ${inf.TurboMaxMHz} MHz</span>
   <b>倍频范围</b><span>${inf.ratioMin}x ~ ${inf.ratioMax}x</span></div>`)}
  ${panel("功耗与电压",`
   <div class="row"><label class="k">PL1 (W)</label><input type="number" id="pl1" value="${p.PL1Watt}" min="1" max="330" style="width:86px">
    <label class="k">PL2 (W)</label><input type="number" id="pl2" value="${p.PL2Watt}" min="1" max="330" style="width:86px"></div>
   <div class="row"><label class="k">PL 时间 (s)</label><input type="number" id="plt" value="${p.PLTimeSec}" min="1" max="128" style="width:86px">
    <label class="k">VR Limit</label><input type="number" id="vr" value="${p.VRLimit}" style="width:86px"></div>
   <div class="row"><label class="k">VR Auto</label><span class="sw"><input type="checkbox" id="vra" ${p.VRAuto?"checked":""}><i></i></span>
    <label class="k">Override (V)</label><input type="number" id="ov" value="${p.OverrideVolt}" step="0.1" min="0" max="2" style="width:86px"></div>
   <div class="row"><label class="k">核心电压偏移</label><input type="number" id="vo" value="${p.CoreOffset}" step="10" style="width:86px"><span class="unit">mV</span></div>`)}
  ${panel("P 核倍频 (1-10)",coreInputs(p.PCores,10,""))}
  ${panel("E 核倍频 (1-16)",coreInputs(p.ECores,16,"E"))}
 </div>
 <div class="row"><button class="act pri" onclick="cpuApply()"><span>保存并应用 (AppSettings page6)</span></button>
  <button class="act" onclick="cpuDefault()"><span>恢复默认</span></button></div>`;
}
async function cpuApply(){
 const p={PL1Watt:+$("#pl1").value,PL2Watt:+$("#pl2").value,PLTimeSec:+$("#plt").value,
  VRAuto:$("#vra").checked,VRLimit:+$("#vr").value,CoreOffset:+$("#vo").value,OverrideVolt:+$("#ov").value,
  GraphicsOff:0,PCores:Array.from({length:10},(_,i)=>+($("#pc"+i)?.value||0)),
  ECores:Array.from({length:16},(_,i)=>+($("#pcE"+i)?.value||0))};
 if(!confirm("应用超频参数?"))return;
 await api("cpu/apply",{params:p});toast("参数已写入 page6,后台 XTU 执行中")}
async function cpuDefault(){if(!confirm("恢复全部默认值?"))return;await api("cpu/default");toast("已恢复默认");loadCPU()}
window.cpuApply=cpuApply;window.cpuDefault=cpuDefault;
/* ================= GPU 超频 ================= */
async function loadGPU(){
 const g=await api("gpu/oc");
 $("#page-gpu").innerHTML=`
 <div class="grid g2">
  ${panel("GPU 资讯",`<div class="kv">
   <b>GPU 数量</b><span>${g.count}</span><b>基础频率</b><span>${g.baseClock} MHz</span>
   <b>NVAPI</b><span>${g.ready?"就绪":"未就绪"}</span><b>驱动</b><span>${g.driver||"—"}</span>
   <b>当前生效</b><span>核心 ${g.current.Core} / 显存 ${g.current.Mem} MHz</span></div>`)}
  ${panel("超频偏移 (MHz)",`
   <div class="row"><label class="k">GPU0 核心</label><span class="val" id="gc0v">${g.saved0.Core}</span></div>
   <input type="range" id="gc0" min="-200" max="400" step="5" value="${g.saved0.Core}" oninput="$('#gc0v').textContent=this.value">
   <div class="row"><label class="k">GPU0 显存</label><span class="val" id="gm0v">${g.saved0.Mem}</span></div>
   <input type="range" id="gm0" min="-200" max="1600" step="5" value="${g.saved0.Mem}" oninput="$('#gm0v').textContent=this.value">
   ${g.count>1?`
   <div class="row"><label class="k">GPU1 核心</label><span class="val" id="gc1v">${g.saved1.Core}</span></div>
   <input type="range" id="gc1" min="-200" max="400" step="5" value="${g.saved1.Core}" oninput="$('#gc1v').textContent=this.value">
   <div class="row"><label class="k">GPU1 显存</label><span class="val" id="gm1v">${g.saved1.Mem}</span></div>
   <input type="range" id="gm1" min="-200" max="1600" step="5" value="${g.saved1.Mem}" oninput="$('#gm1v').textContent=this.value">`:""}
   <div class="row" style="margin-top:12px">
    <button class="act pri" onclick="gpuSave(${g.count>1})"><span>保存并应用</span></button>
    <button class="act" onclick="gpuReset(${g.count>1})"><span>恢复默认</span></button></div>
   <div class="hint">写入 AppSettings page5(非对称 int16)→ ControlGPU.exe set_increment</div>`)}
 </div>`;
}
async function gpuSave(dual){await api("gpu/oc",{action:"save",core0:+$("#gc0").value,mem0:+$("#gm0").value,
 core1:+($("#gc1")?.value||0),mem1:+($("#gm1")?.value||0),dual});toast("GPU 偏移已下发")}
async function gpuReset(dual){await api("gpu/oc",{action:"reset",dual});toast("已恢复默认");loadGPU()}
window.gpuSave=gpuSave;window.gpuReset=gpuReset;
/* ================= 电池 ================= */
async function loadBat(){
 const b=await api("battery");
 const hc=["健康","老化","需要更换","永久失效"][b.healthCode];
 const cls=b.healthCode===0?"ok":(b.healthCode===1?"warn":"err");
 $("#page-bat").innerHTML=`
 <div class="grid g2">
  ${panel("电池信息",`<div class="kv">
   <b>循环次数</b><span>${b.data.cycleCount}</span><b>满充容量</b><span>${b.data.fullCharge} mAh</span>
   <b>设计容量</b><span>${b.data.design} mAh</span><b>容量保持</b><span>${b.data.capacityPct}%</span>
   <b>使用年限</b><span>${(b.data.ageYears||0).toFixed(1)} 年</span><b>停充阈值</b><span>${b.data.stopChargeThreshold}%</span></div>
   <div style="margin-top:12px">健康判定:<span class="badge ${cls}">${hc}</span></div>`)}
  ${panel("电池校准",`<div class="hint">校准将强制断开适配器放电(WMI 121/28),请接入电源后开始;整个过程可能耗时数小时。</div>
   <div class="row" style="margin-top:14px">
    ${b.ongoing===0?`<button class="act pri" onclick="batRefresh('start')"><span>开始校准</span></button>`:
     `<span class="badge warn">校准进行中(阶段 ${b.ongoing})</span><button class="act" onclick="batRefresh('stop')"><span>停止</span></button>`}</div>`)}
 </div>`;
}
async function batRefresh(a){if(a==="start"&&!confirm("开始电池校准?期间请保持适配器可断开。"))return;
 await api("battery/refresh",{action:a});toast("已下发");loadBat()}
window.batRefresh=batRefresh;
/* ================= 节能计划 ================= */
let wattTimer=null,wattData=[];
async function loadEnergy(){
 $("#page-energy").innerHTML=`
 <div class="grid g2">
  ${panel("实时功耗",`<canvas class="chart" id="wattcv" width="560" height="170"></canvas>
   <div class="row"><span class="bignum" id="wattnow" style="font-size:32px">-- W</span>
    <span class="unit" id="energy-meta">电池 — Wh · 适配器 — W</span></div>`)}
  ${panel("充放电阈值 / 调度",`
   <div class="row"><label class="k">充电上限 %</label>
    <select id="ec-cl">${[60,70,80,90,100].map(v=>`<option ${v===100?"selected":""}>${v}</option>`).join("")}</select>
    <label class="k">放电下限 %</label>
    <select id="ec-dl">${[40,50,60,70,80,90,95].map(v=>`<option ${v===40?"selected":""}>${v}</option>`).join("")}</select></div>
   <h3 style="margin-top:14px">调度一</h3>
   <div class="row"><span class="sw"><input type="checkbox" id="es1on"><i></i></span>
    <input type="number" id="es1s" min="0" max="23" value="22" style="width:64px"> 时起
    <input type="number" id="es1e" min="0" max="23" value="6" style="width:64px"> 时止</div>
   <h3 style="margin-top:10px">调度二</h3>
   <div class="row"><span class="sw"><input type="checkbox" id="es2on"><i></i></span>
    <input type="number" id="es2s" min="0" max="23" value="12" style="width:64px"> 时起
    <input type="number" id="es2e" min="0" max="23" value="14" style="width:64px"> 时止</div>
   <div class="row"><label class="k">重复</label>
    <select id="es-ev"><option value="1">每天</option><option value="0">按星期</option></select></div>
   <div class="row"><button class="act pri" onclick="energyApply()"><span>应用节能计划</span></button>
    <button class="act" onclick="energyDisable()"><span>停用</span></button></div>
   <div class="hint">下发:WMI 118(时间同步 → 生效日 → 调度×2 → 使能 → 阈值)</div>`)}
 </div>`;
 if(wattTimer)clearInterval(wattTimer);
 const tick=async()=>{try{const s=await api("energy/sample");wattData.push(s.watt);
  if(wattData.length>60)wattData.shift();
  $("#wattnow").textContent=s.watt.toFixed(1)+" W";
  const meta=$("#energy-meta");
  if(meta)meta.textContent=`电池 ${s.batWh?s.batWh.toFixed(1):"—"} Wh · 适配器/PD ${s.pdWatt?s.pdWatt.toFixed(0):"—"} W`;
  drawWatt();}catch(e){}};
 tick();wattTimer=setInterval(tick,1000);
}
function drawWatt(){const cv=$("#wattcv");if(!cv)return;const c=cv.getContext("2d");
 const W=cv.width,H=cv.height;c.clearRect(0,0,W,H);
 c.strokeStyle="#151a1e";c.lineWidth=1;
 for(let i=1;i<4;i++){c.beginPath();c.moveTo(0,H*i/4);c.lineTo(W,H*i/4);c.stroke()}
 if(wattData.length<2)return;
 const max=Math.max(30,...wattData)*1.15;
 c.strokeStyle="#25c8ff";c.lineWidth=2;c.shadowColor="#25c8ff";c.shadowBlur=8;c.beginPath();
 wattData.forEach((v,i)=>{const x=i/59*W,y=H-(v/max)*H;i?c.lineTo(x,y):c.moveTo(x,y)});
 c.stroke();c.shadowBlur=0}
async function energyApply(){const p={Name:"go",Schedule1On:$("#es1on").checked,
 Schedule1Start:+$("#es1s").value,Schedule1End:+$("#es1e").value,
 Schedule2On:$("#es2on").checked,Schedule2Start:+$("#es2s").value,Schedule2End:+$("#es2e").value,
 Everyday:$("#es-ev").value==="1",Weekdays:[true,true,true,true,true,true,true],
 AutoBattery:true,ChargeLimit:+$("#ec-cl").value,DischargeLimit:+$("#ec-dl").value};
 if(p.Schedule1On&&p.Schedule2On){const o1=[p.Schedule1Start,p.Schedule1End+1],o2=[p.Schedule2Start,p.Schedule2End+1];
  const d1=o1[0]-o2[1],d2=o1[1]-o2[0];
  if((d1<=0||d2<=0)&&(d1>=0||d2>=0)){toast("两个调度重叠(至少间隔 1 小时)");return}}
 await api("energy/apply",p);toast("节能计划已下发")}
async function energyDisable(){await api("energy/apply",{Name:"off",ChargeLimit:100,DischargeLimit:95,
 Everyday:true,Weekdays:[true,true,true,true,true,true,true]});toast("已停用(阈值 100/95)")}
window.energyApply=energyApply;window.energyDisable=energyDisable;
/* ================= 偏好 ================= */
async function loadPref(){
 const p=await api("preference");
 $("#page-pref").innerHTML=`
 <div class="grid g2">
  ${panel("键盘 Fn 键行为",`
   <div class="row"><label class="k">FnLock</label><span class="sw"><input type="checkbox" id="kb-fn" ${p.keyboard.fnLock?"checked":""}><i></i></span>
    <label class="k">Win 键启用</label><span class="sw"><input type="checkbox" id="kb-win" ${p.keyboard.winKey?"checked":""}><i></i></span>
    <label class="k">Win+Fn 切换</label><span class="sw"><input type="checkbox" id="kb-fnwin" ${p.keyboard.fnWin?"checked":""}><i></i></span></div>
   <div class="row"><button class="act pri" onclick="saveKbPref()"><span>应用</span></button>
    <span class="hint">WMI4 sub25(1=on,2=off)</span></div>`)}
  ${panel("显示",`
   <div class="row"><label class="k">蓝光过滤</label><span class="val" id="blv2">${p.blueLight}</span></div>
   <input type="range" id="bl2" min="0" max="10" step="1" value="${p.blueLight}" oninput="$('#blv2').textContent=this.value">
   <div class="row"><label class="k">PgUp/PgDn 启用</label><span class="sw"><input type="checkbox" id="pg" ${p.pgUpDn?"checked":""}><i></i></span>
    <button class="act pri" onclick="saveDisplay()"><span>应用</span></button></div>`)}
  ${panel("GPU 模式切换(需重启)",`
   <div class="row"><select id="gpusw">
     ${p.gpuSwitch.support&1?`<option value="1" ${p.gpuSwitch.current===1?"selected":""}>仅集成显卡</option>`:""}
     ${p.gpuSwitch.support&2?`<option value="2" ${p.gpuSwitch.current===2?"selected":""}>仅独立显卡</option>`:""}
     ${p.gpuSwitch.support&4?`<option value="3" ${p.gpuSwitch.current===3?"selected":""}>MS Hybrid</option>`:""}
     ${p.gpuSwitch.support&8?`<option value="4" ${p.gpuSwitch.current===4?"selected":""}>动态切换</option>`:""}
    </select>
    <button class="act warn" onclick="saveGPU()"><span>应用并重启</span></button></div>
   <div class="hint">WMI4 sub22 → shutdown -f -r -t 0</div>`)}
  ${panel("界面语言",`
   <div class="row"><select id="lang">${[
     [0,"跟随系统"],[1,"English(US)"],[2,"English(GB)"],[3,"Español"],[4,"Deutsch"],[5,"Italiano"],
     [6,"日本語"],[7,"한국어"],[8,"简体中文"],[9,"繁體中文"],[10,"Français"],[11,"Français(CA)"],
     [12,"Português(BR)"],[13,"Português(PT)"],[14,"Türkçe"],[15,"ไทย"],[16,"Tiếng Việt"],[17,"Русский"],[18,"日本語(EP)"]]
     .map(l=>`<option value="${l[0]}" ${p.language===l[0]?"selected":""}>${l[1]}</option>`).join("")}</select>
    <button class="act pri" onclick="saveLang()"><span>应用</span></button></div>
   <div class="hint">写入 AppSettings(1,2) 并广播 clevofnkey^102</div>`)}
 </div>`;
}
async function saveKbPref(){await api("preference",{keyboard:{fnLock:$("#kb-fn").checked,
 winKey:$("#kb-win").checked,fnWin:$("#kb-fnwin").checked}});toast("键盘设置已下发")}
async function saveDisplay(){await api("preference",{blueLight:+$("#bl2").value,pgUpDn:$("#pg").checked});toast("显示设置已应用")}
async function saveGPU(){if(!confirm("切换 GPU 模式将立即重启,继续?"))return;
 await api("preference",{gpuSwitch:+$("#gpusw").value});toast("已下发,即将重启")}
async function saveLang(){await api("preference",{language:+$("#lang").value});toast("语言已切换")}
window.saveKbPref=saveKbPref;window.saveDisplay=saveDisplay;window.saveGPU=saveGPU;window.saveLang=saveLang;
/* ---------- 启动(支持 #page 深链:面板启动器 / 托盘 / 热键直达) ---------- */
const PAGE_INIT={system:loadSystem,kb:loadKB,flexikey:loadFlexikey,charger:loadCharger,
 cpu:loadCPU,gpu:loadGPU,bat:loadBat,energy:loadEnergy,pref:loadPref};
// 原版协议/启动器使用的页名 → 本 UI 页 ID
const PAGE_ALIAS={home:"system",power:"system",fan:"system",mode:"system",system:"system",
 keyboard:"kb",perkey:"kb",led:"kb",kb:"kb",flexikey:"flexikey",flexiacc:"flexikey",
 charger:"charger",flexicharger:"charger",cpu:"cpu",cpuoc:"cpu",gpu:"gpu",gpuoc:"gpu",
 battery:"bat",bat:"bat",energy:"energy",energysave:"energy",pref:"pref",preference:"pref",
 preferences:"pref",setting:"pref",settings:"pref",monitor:"system"};
function pageFromHash(){const h=(location.hash||"").replace(/^#\/?/,"").toLowerCase();
 return PAGE_ALIAS[h]||null}
PAGES.forEach(p=>{const d=document.createElement("div");d.className="page";d.id="page-"+p.id;
 $("#main").appendChild(d)});
window.addEventListener("hashchange",()=>{const p=pageFromHash();if(p)nav(p)});
// 每 15 秒确认服务端本进程标记是否变化(ccapp 重启/升级后自动刷新到新 UI)
setInterval(async()=>{try{const st=await api("status");
 if(window._boot&&st.boot&&st.boot!==window._boot)location.reload()}catch(e){}},15000);
(async()=>{try{await loadSystem();nav(pageFromHash()||"system")}catch(e){
 $("#main").innerHTML=`<div class="panel"><i class="cnr c1"></i><i class="cnr c2"></i><i class="cnr c3"></i><i class="cnr c4"></i>
  <h3>无法连接 ACPI 桥驱动</h3><p>${e.message}</p>
  <p class="hint">请确认 AcpiBridge 驱动已安装且以管理员身份运行。</p></div>`;}})();
</script>
</body>
