<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Control Center · UI 规范示例(系统监控页)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#0D1117; --card:#161B22; --line:#30363D;
    --txt:#E6EDF3; --dim:#8B949E; --cyan:#25C8FF; --lime:#C8FF00; --yellow:#E3B341;
  }
  body{background:linear-gradient(180deg,#10151C 0%,#0B0F14 40%,#070A0E 100%);color:var(--txt);
    font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .num{font-variant-numeric:tabular-nums}
  /* 卡片:半透明毛玻璃 + 圆角 10 + 描边 + 四角角标 */
  .card{position:relative;background:rgba(22,27,34,.88);border:1px solid var(--line);border-radius:10px;padding:16px}
  .card::before,.card::after,.card>i.c3,.card>i.c4{content:"";position:absolute;width:9px;height:9px;pointer-events:none}
  .card::before{top:-1px;left:-1px;border-top:1px solid var(--dim);border-left:1px solid var(--dim)}
  .card::after{top:-1px;right:-1px;border-top:1px solid var(--dim);border-right:1px solid var(--dim)}
  .card>i.c3{bottom:-1px;left:-1px;border-bottom:1px solid var(--dim);border-left:1px solid var(--dim)}
  .card>i.c4{bottom:-1px;right:-1px;border-bottom:1px solid var(--dim);border-right:1px solid var(--dim)}
  .card-title{font-size:12px;letter-spacing:.2em;color:#C2CCD4;margin:-4px 0 12px}
  /* 斜切 tab / 按钮 */
  .tab{transform:skewX(-14deg);padding:4px 22px;color:var(--dim);font-size:13px;letter-spacing:.1em}
  .tab>span{display:block;transform:skewX(14deg)}
  .tab.on{background:var(--cyan);color:#00161C;font-weight:600}
  .btn{transform:skewX(-10deg);border:1px solid var(--line);background:#0C1013;padding:6px 18px;font-size:13px}
  .btn>span{display:block;transform:skewX(10deg)}
  .btn.pri{background:var(--cyan);border-color:var(--cyan);color:#00161C;font-weight:600}
  /* 点阵进度条 */
  .dots{height:7px;background:
    radial-gradient(circle at 3px 3.5px,var(--lime) 1.7px,transparent 2.3px) 0 0/9px 7px repeat-x}
  .switch{width:40px;height:20px;border:1px solid var(--line);background:#0C1013;position:relative}
  .switch.on{border-color:var(--lime)}
  .switch.on::after{left:22px;background:var(--lime);box-shadow:0 0 8px rgba(200,255,0,.6)}
  .switch::after{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;background:#59636D;transition:.15s}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
  .kv b{color:var(--dim);font-weight:400}
</style>
</head>
<body class="min-h-screen">
<div class="flex min-h-screen">
  <!-- 侧栏:宽 112 / 项高 66 / 图标 22 + 文字 11 / 选中左竖条 -->
  <aside class="w-[112px] flex-none bg-[#010409] border-r border-[#15181B] flex flex-col">
    <div class="h-11 flex items-center justify-center text-[#9AA4AD] text-lg">≡</div>
    <nav class="flex flex-col">
      <a class="h-[66px] flex flex-col items-center justify-center gap-1 text-[11px] bg-[#161B22] text-[color:var(--lime)] relative">
        <span class="absolute left-0 top-0 bottom-0 w-[3px] bg-[color:var(--lime)]"></span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M9 20h6M12 16v4M7 9h4M7 12h7"/></svg>
        系统监控</a>
      <a class="h-[66px] flex flex-col items-center justify-center gap-1 text-[11px] text-[#59636D]">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="11" rx="1"/><path d="M7 15.5h10"/></svg>
        LED 设备</a>
      <!-- 其余导航项同构 -->
    </nav>
  </aside>

  <div class="flex-1 min-w-0 flex flex-col">
    <!-- 顶栏:高 44 / 标题 16 / 两侧装饰线 -->
    <header class="h-11 flex items-center justify-center border-b border-[#14171A] relative text-base relative">
      <span class="absolute w-6 h-px bg-[color:var(--cyan)]/60 -translate-x-[calc(50%+4.5rem)]"></span>
      Control Center
      <span class="absolute w-6 h-px bg-[color:var(--cyan)]/60 translate-x-[calc(-50%+4.5rem)]"></span>
    </header>
    <div class="text-xs text-[#5F6A74] px-6 pt-2.5 tracking-wide">COLORFUL P16 Pro IXA1 · BIOS 1.07.14COLO · i9-14900HX · ClevoID 25990 · 客户 0</div>

    <main class="p-6 flex-1">
      <!-- 模式 tab 行(斜切) -->
      <div class="flex justify-center gap-8 mb-4">
        <button class="tab"><span>安静</span></button>
        <button class="tab"><span>节能</span></button>
        <button class="tab on"><span>性能</span></button>
        <button class="tab"><span>娱乐</span></button>
        <button class="tab"><span>安静增强</span></button>
      </div>

      <div class="grid grid-cols-[5fr_4fr] gap-4 items-start">
        <!-- 左栏 -->
        <section class="flex flex-col gap-3">
          <!-- 仪表盘 + 三等分数字 -->
          <div class="card flex flex-col items-center">
            <svg width="260" height="230" viewBox="0 0 330 300">
              <g stroke="#30363D" stroke-width="1">
                <!-- 刻度环示意(50 刻) -->
                <circle cx="165" cy="150" r="118" fill="none" stroke-dasharray="2 13.7"/>
              </g>
              <path d="M 81 234 A 118 118 0 1 1 249 234" fill="none" stroke="var(--cyan)" stroke-width="3"
                stroke-linecap="round" filter="drop-shadow(0 0 8px rgba(37,200,255,.55))" stroke-dasharray="290 520"/>
              <text x="165" y="245" text-anchor="middle" fill="#CFD6DC" font-size="14" font-weight="600">CPU</text>
            </svg>
            <!-- 三等分:左组左对齐 / 中组居中 / 右组右对齐 -->
            <div class="w-full grid grid-cols-3 px-2">
              <div class="text-left"><div class="num text-[38px] font-extralight leading-none">4700</div>
                <div class="text-xs text-[color:var(--dim)] mt-1">MHz · 时序</div></div>
              <div class="text-center"><div class="num text-3xl font-extralight leading-none">21%</div>
                <div class="text-xs text-[color:var(--dim)] mt-1">利用率</div></div>
              <div class="text-right"><div class="num text-[38px] font-extralight leading-none">58</div>
                <div class="text-xs text-[color:var(--dim)] mt-1">℃ · 温度</div></div>
            </div>
          </div>
          <!-- 风扇曲线编辑器卡片(三点拖拽 + 当前温度点) -->
          <div class="card">
            <div class="card-title">风扇转速控制</div>
            <div class="grid grid-cols-3 gap-3">
              <!-- 单个曲线编辑器示意 -->
              <div class="relative aspect-[158/112] rounded border border-[#151A1E] overflow-hidden">
                <div class="absolute inset-0" style="background:
                  linear-gradient(#151A1E 1px,transparent 1px) 0 25%/100% 25%,
                  linear-gradient(90deg,#151A1E 1px,transparent 1px) 25% 0/25% 100%"></div>
                <svg class="absolute inset-0 w-full h-full" viewBox="0 0 158 112" preserveAspectRatio="none">
                  <polyline points="10,80 60,60 105,30 148,10" fill="none" stroke="var(--cyan)" stroke-width="1.5" filter="drop-shadow(0 0 4px rgba(37,200,255,.4))"/>
                  <line x1="88" y1="10" x2="88" y2="102" stroke="var(--yellow)" stroke-opacity=".35"/>
                  <circle cx="88" cy="45" r="3" fill="var(--yellow)"/>
                  <circle cx="60" cy="60" r="4.5" fill="var(--cyan)"/><circle cx="105" cy="30" r="4.5" fill="var(--cyan)"/>
                </svg>
                <span class="absolute bottom-1 left-1/2 -translate-x-1/2 text-[10px] text-[color:var(--dim)]">CPU 曲线</span>
              </div>
              <div class="relative aspect-[158/112] rounded border border-[#151A1E]"></div>
              <div class="relative aspect-[158/112] rounded border border-[#151A1E]"></div>
            </div>
            <div class="flex gap-3 mt-3">
              <button class="btn pri"><span>保存并启用自定义曲线</span></button>
              <button class="btn"><span>恢复默认曲线</span></button>
            </div>
          </div>
        </section>

        <!-- 右栏:全宽监控 + 两对半宽卡片 -->
        <section class="flex flex-col gap-3">
          <div class="card">
            <div class="card-title">CPU 监控</div>
            <svg class="w-full h-[92px]" viewBox="0 0 480 92" preserveAspectRatio="none">
              <polyline points="0,40 80,42 160,38 240,50 320,44 400,52 480,46" fill="none" stroke="var(--yellow)" stroke-width="1.6"/>
              <polyline points="0,70 80,66 160,72 240,60 320,68 400,58 480,64" fill="none" stroke="var(--cyan)" stroke-width="1.6"/>
            </svg>
            <div class="flex gap-4 text-[11px] mt-1">
              <span class="text-[color:var(--yellow)]">温度℃ 58</span>
              <span class="text-[color:var(--cyan)]">利用率% 21</span>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="card">
              <div class="card-title">GPU 资讯</div>
              <div class="kv">
                <b>GPU 温度</b><span class="num">46 ℃</span>
                <b>风扇占空</b><span class="num">25 %</span>
                <b>NVAPI</b><span>未就绪</span>
              </div>
              <div class="dots mt-2" style="width:45%"></div>
            </div>
            <div class="card">
              <div class="card-title">系统资讯</div>
              <div class="kv">
                <b>核心</b><span class="num">24</span>
                <b>键盘灯</b><span>RGB15 色</span>
                <b>BIOS</b><span class="num">1.07.14COLO</span>
              </div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="card">
              <div class="card-title">偏好</div>
              <div class="grid grid-cols-2 gap-2 text-center text-[11px]">
                <div class="py-2 text-[color:var(--lime)]"><svg class="mx-auto mb-1" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Win 键锁</div>
                <div class="py-2 text-[#4D5761]"><svg class="mx-auto mb-1" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2 5 13h5l-1 9 8-11h-5z"/></svg>涡轮风扇</div>
              </div>
            </div>
            <div class="card">
              <div class="card-title">配置</div>
              <div class="flex items-center gap-2 text-xs text-[color:var(--dim)]">蓝光
                <span class="num text-[color:var(--lime)]">0/10</span></div>
              <div class="h-1.5 mt-2 dots" style="width:0"></div>
              <div class="flex items-center gap-2 mt-3 text-xs text-[color:var(--dim)]">GPU 模式
                <span class="px-2 py-0.5 border border-[color:var(--line)] text-[#AEB8C1] text-xs">MS Hybrid</span></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>
</body>
</html>
